# The 8G heap of the old template value does not fit dev machines with 8GB of
# RAM, and the separate Kotlin compile daemon cannot start on some Windows
# machines ("Failed connecting to the daemon in 4 retries"). 3G is enough for
# this project, and compiling in-process keeps `flutter build apk` working.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
